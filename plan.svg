<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Inter Tight, Inter, Arial, sans-serif">
  <rect width="760" height="440" fill="#f3eee6"/>
  <!-- deck outline -->
  <rect x="40" y="40" width="680" height="340" rx="6" fill="#d9d3c9" stroke="#8d8a86" stroke-width="3"/>
  <!-- parking bay ghost lines -->
  <g stroke="#bdb6aa" stroke-width="1.5">
    <line x1="80" y1="40" x2="80" y2="100"/><line x1="120" y1="40" x2="120" y2="100"/><line x1="160" y1="40" x2="160" y2="100"/><line x1="200" y1="40" x2="200" y2="100"/><line x1="240" y1="40" x2="240" y2="100"/><line x1="280" y1="40" x2="280" y2="100"/><line x1="320" y1="40" x2="320" y2="100"/><line x1="360" y1="40" x2="360" y2="100"/><line x1="400" y1="40" x2="400" y2="100"/><line x1="440" y1="40" x2="440" y2="100"/><line x1="480" y1="40" x2="480" y2="100"/>
    <line x1="80" y1="320" x2="80" y2="380"/><line x1="120" y1="320" x2="120" y2="380"/><line x1="160" y1="320" x2="160" y2="380"/><line x1="200" y1="320" x2="200" y2="380"/><line x1="240" y1="320" x2="240" y2="380"/><line x1="280" y1="320" x2="280" y2="380"/><line x1="320" y1="320" x2="320" y2="380"/><line x1="360" y1="320" x2="360" y2="380"/><line x1="400" y1="320" x2="400" y2="380"/><line x1="440" y1="320" x2="440" y2="380"/><line x1="480" y1="320" x2="480" y2="380"/>
  </g>

  <!-- zones -->
  <rect x="56" y="56" width="190" height="130" rx="10" fill="#5fae6e" opacity="0.9"/>
  <text x="151" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1 · Shade &amp; Grow</text>
  <text x="151" y="134" text-anchor="middle" font-size="12.5" fill="#f3fff3">adopt-a-crate planters</text>
  <text x="151" y="151" text-anchor="middle" font-size="12.5" fill="#f3fff3">shade sails · seating</text>

  <rect x="56" y="200" width="190" height="164" rx="10" fill="#e2574c" opacity="0.9"/>
  <text x="151" y="268" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2 · Makan</text>
  <text x="151" y="290" text-anchor="middle" font-size="12.5" fill="#fff0ee">8–10 stalls for home-</text>
  <text x="151" y="307" text-anchor="middle" font-size="12.5" fill="#fff0ee">based businesses</text>

  <rect x="262" y="56" width="250" height="308" rx="10" fill="#2e8f8a" opacity="0.92"/>
  <rect x="292" y="110" width="190" height="200" fill="none" stroke="#f6eedf" stroke-width="2.5"/>
  <line x1="292" y1="210" x2="482" y2="210" stroke="#f6eedf" stroke-width="2.5"/>
  <text x="387" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3 · Play</text>
  <text x="387" y="166" text-anchor="middle" font-size="12.5" fill="#e7fffd">painted court</text>
  <text x="387" y="183" text-anchor="middle" font-size="12.5" fill="#e7fffd">pickleball · futsal</text>
  <text x="387" y="250" text-anchor="middle" font-size="12.5" fill="#e7fffd">mornings: tai chi</text>
  <text x="387" y="267" text-anchor="middle" font-size="12.5" fill="#e7fffd">&amp; seniors' walks</text>
  <text x="387" y="340" text-anchor="middle" font-size="12.5" fill="#e7fffd">kids' chalk strip</text>

  <rect x="528" y="56" width="120" height="308" rx="10" fill="#f2a541" opacity="0.95"/>
  <text x="588" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1d33">4 · Sunset</text>
  <text x="588" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1d33">Screen</text>
  <text x="588" y="234" text-anchor="middle" font-size="12.5" fill="#3a2a10">pallet seating</text>
  <text x="588" y="251" text-anchor="middle" font-size="12.5" fill="#3a2a10">films · talks</text>

  <!-- core -->
  <rect x="660" y="150" width="54" height="120" fill="#4a4f70"/>
  <text x="687" y="205" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="600">lift +</text>
  <text x="687" y="220" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="600">stairs</text>
  <rect x="652" y="160" width="6" height="100" fill="#f6eedf"/>

  <!-- ramp -->
  <path d="M720 300 L760 300 L760 350 L720 350" fill="#b8b1a5"/>
  <rect x="300" y="405" width="22" height="14" fill="#b8b1a5"/>
  <text x="330" y="417" font-size="13" fill="#3a3f5e">ramp: barrier during events</text>

  <!-- sensors -->
  <g fill="#1d2346">
    <circle cx="250" cy="194" r="6"/><circle cx="520" cy="194" r="6"/><circle cx="656" cy="290" r="6"/>
  </g>
  <circle cx="60" cy="412" r="6" fill="#1d2346"/>
  <text x="74" y="417" font-size="13" fill="#3a3f5e">footfall · heat · noise sensors</text>
  <text x="40" y="26" font-size="13" fill="#3a3f5e" font-weight="600">Top deck plan · approx. 60 × 30 m · not to scale</text>
</svg>
